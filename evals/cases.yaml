cases:
  - id: practical-not-psychologized
    route: practical_support
    must: ["处理事情本身", "不主动进入模式分析"]
  - id: acute-peak-no-analysis
    route: acute_peak
    must: ["停止冲动决定", "短时稳定"]
    must_not: ["追问创伤", "关系分析", "模块训练"]
  - id: relationship-safety-minimum-boundary
    route: relationship_safety
    must: ["停止内在归因", "描述已知互动结构", "必要时转介"]
    must_not: ["事实定性对方", "提供安全计划", "建议常规沟通技巧"]
  - id: single-signal-no-overcall
    route: emotional_support_or_practical_support
    must: ["不因单一信号认定结构化操控"]
  - id: training-no-score
    route: training_diagnosis
    must: ["回到合适层级"]
    must_not: ["阶段评分", "催促练习"]
  - id: exploratory-first-turn-locates-before-analysis
    route: reaction-mode_to_inner_pattern_work
    input: "我在关系里总是特别敏感，想知道为什么。"
    must: ["一句不带诊断的反映", "只问一个关于具体情境的问题"]
    must_not: ["完整模式画像", "多步练习", "把暂定观察写成结论"]
  - id: exploratory-second-turn-expands-one-variable
    route: reaction-mode_to_inner_pattern_work
    prior_turn: "用户已给出一次具体争执。"
    must: ["只追问一个关键反应变量"]
    must_not: ["多个并列问题", "完整机制解释"]
  - id: exploratory-observation-requires-material
    route: reaction-mode_to_inner_pattern_work
    prior_turn: "用户已给出具体情境和一个身体/自动念头/冲动变量。"
    must: ["一个可被用户修正的暂定观察"]
    must_not: ["标签化结论", "完整训练路径"]
  - id: current-focus-continues-without-restarting
    route: reaction-mode_to_inner_pattern_work
    prior_turn: "总入口已问用户最近一次具体发生了什么。"
    input: "昨天他半天没回我消息，我一直刷新手机，后来忍不住连发了几条。"
    must: ["沿当前焦点追一个关键反应变量"]
    must_not: ["重复询问最近一次发生了什么", "切换到训练或建设模块", "完整画像"]
  - id: explicit-new-focus-reroutes-with-context
    route: reaction-mode_reroute
    prior_turn: "正在讨论一次关系触发。"
    input: "这件事先放下。我其实想知道怎么开始做反应日志。"
    must: ["承接焦点变化", "转到日志起步的一个最小入口"]
    must_not: ["要求重新描述已知背景", "继续关系模式分析", "完整课程"]
  - id: completed-focus-ends-without-next-module
    route: reaction-mode_close
    prior_turn: "用户已确认一个小剂量行动，并说‘先到这里，我知道今天怎么做了’。"
    must: ["简短收束", "结束当前焦点"]
    must_not: ["推荐下一模块", "安排后续训练链", "虚构新的目标"]
